<!doctype html>
<title>Shadi Table Card</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,800;9..144,900&family=Work+Sans:wght@400;500;600;700;800&display=swap');

  :root{
    --panel:#15140f; --panel-2:#1e1c15;
    --gold:#c9982e; --gold-soft:#e7cb8c;
    --cream:#faf6ec; --paper:#fffcf6;
    --page-bg:#efe8d5;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; }
  body{
    background:var(--page-bg);
    font-family:'Work Sans', -apple-system, 'Segoe UI', sans-serif;
    display:flex; flex-direction:column; align-items:center; gap:16px;
    padding:26px 14px 40px;
    color:#241f14;
  }
  .toolbar{ display:flex; gap:10px; align-items:center; }
  .toolbar button{
    font-family:inherit; font-size:12.5px; font-weight:700; letter-spacing:.03em;
    padding:9px 16px; border-radius:999px; border:1px solid var(--panel);
    background:var(--panel); color:var(--cream); cursor:pointer;
  }
  .toolbar button:hover{ background:#000; }
  .toolbar .hint{ font-size:12px; color:#6b6250; }

  .card{
    width:1040px; height:594px;
    background:var(--panel);
    border-radius:26px;
    box-shadow:0 30px 60px -20px rgba(20,20,15,.45);
    display:grid; grid-template-columns:1.35fr 6px 1fr;
    overflow:hidden;
    position:relative;
  }
  .divider{ background:linear-gradient(180deg, var(--gold), #a3781f); }

  /* -------- Left: scene -------- */
  .scene{
    position:relative;
    background:linear-gradient(165deg, #cfe1ea 0%, #eeddb9 42%, #f8ecd7 75%, #fbf3e2 100%);
    overflow:hidden;
  }
  .scene svg.illus{ position:absolute; inset:0; display:block; width:100%; height:100%; }
  .olive{ position:absolute; top:-8px; left:-8px; width:150px; z-index:3; }

  .brandblock{
    position:absolute; left:50%; top:26px; transform:translateX(-50%); text-align:center; z-index:3;
  }
  .brandblock img{
    width:168px; height:168px; border-radius:50%; object-fit:cover; display:block; margin:0 auto;
    filter:drop-shadow(0 10px 18px rgba(40,30,10,.28));
  }

  /* -------- Right: info -------- */
  .info{
    background:linear-gradient(175deg, var(--panel-2), var(--panel));
    color:var(--cream);
    padding:42px 40px 32px;
    display:flex; flex-direction:column; align-items:center; text-align:center;
  }
  .info .eyebrow{ font-family:'Fraunces',serif; font-weight:800; font-size:24px; letter-spacing:.02em; color:var(--paper); }
  .info .sub{ font-size:12px; font-weight:700; letter-spacing:.24em; text-transform:uppercase; color:#c9c3b4; margin-top:6px; }

  .qrwrap{
    background:#fff; border-radius:14px; padding:12px; margin:22px 0 20px;
    border:3px solid var(--gold);
  }
  #qr{ width:176px; height:176px; }
  #qr img{ display:block; width:176px !important; height:176px !important; }

  .info .line{ display:flex; align-items:center; gap:8px; font-size:15px; font-weight:700; margin:6px 0; letter-spacing:.02em; }
  .info .line svg{ width:15px; height:15px; color:var(--gold); flex:none; }
  .rule{ width:64%; height:1px; background:rgba(233,205,147,.28); margin:18px 0 16px; }
  .social-row{ display:flex; gap:12px; }
  .social-row a{
    width:34px; height:34px; border-radius:50%;
    background:var(--gold);
    display:flex; align-items:center; justify-content:center; color:#1a1710; text-decoration:none;
    transition:.15s;
  }
  .social-row a:hover{ background:var(--gold-soft); }
  .social-row svg{ width:16px; height:16px; }
  .handle{ margin-top:12px; font-weight:800; letter-spacing:.08em; font-size:14px; color:var(--cream); }

  @media print{
    body{ background:#fff; padding:0; align-items:flex-start; }
    .toolbar{ display:none; }
    .card{ box-shadow:none; margin:0; }
  }
</style>

<div class="toolbar">
  <button onclick="window.print()">Print Table Card</button>
  <span class="hint">Sized for a 4&times;2.2&Prime; table card &mdash; scan links straight to the live Shadi menu</span>
</div>

<div class="card">
  <div class="scene">
    <svg class="illus" viewBox="0 0 700 594" preserveAspectRatio="xMidYMax slice" xmlns="http://www.w3.org/2000/svg">
      <!-- distant skyline haze -->
      <g opacity=".35" fill="#7f97ab">
        <rect x="470" y="250" width="14" height="60"/><rect x="488" y="235" width="18" height="75"/>
        <rect x="510" y="260" width="12" height="50"/><rect x="526" y="245" width="16" height="65"/>
        <rect x="546" y="255" width="10" height="55"/><rect x="560" y="238" width="20" height="72"/>
        <rect x="584" y="262" width="12" height="48"/>
      </g>
      <!-- string lights -->
      <path d="M40 150 C220 95, 480 95, 660 155" stroke="rgba(201,152,46,.55)" stroke-width="2" fill="none"/>
      <g fill="#e7c877">
        <circle cx="70" cy="140" r="5"/><circle cx="170" cy="112" r="5"/><circle cx="280" cy="99" r="5"/>
        <circle cx="400" cy="99" r="5"/><circle cx="510" cy="114" r="5"/><circle cx="620" cy="143" r="5"/>
      </g>
      <!-- ground -->
      <rect x="0" y="470" width="700" height="124" fill="#e7dcc0"/>
      <ellipse cx="350" cy="470" rx="420" ry="22" fill="#d8caa6" opacity=".6"/>
      <!-- umbrella + table (left foreground) -->
      <g transform="translate(30,300)">
        <path d="M0 60 L90 60 L45 -10Z" fill="#f6efe0" stroke="#cbb98c" stroke-width="2"/>
        <line x1="45" y1="60" x2="45" y2="190" stroke="#8a7a54" stroke-width="5"/>
        <rect x="10" y="190" width="70" height="8" rx="3" fill="#7c6c46"/>
        <rect x="60" y="205" width="55" height="34" rx="3" fill="#6b5c3c"/>
        <rect x="66" y="245" width="8" height="34" fill="#544829"/><rect x="100" y="245" width="8" height="34" fill="#544829"/>
        <rect x="4" y="225" width="26" height="30" rx="3" fill="#5c4e30"/><rect x="8" y="255" width="6" height="24" fill="#453a22"/><rect x="20" y="255" width="6" height="24" fill="#453a22"/>
      </g>
      <!-- food truck -->
      <g transform="translate(190,230)">
        <rect x="0" y="70" width="330" height="100" rx="12" fill="#232320"/>
        <rect x="0" y="24" width="165" height="60" rx="9" fill="#232320"/>
        <rect x="18" y="80" width="130" height="58" rx="5" fill="#c9982e" opacity=".92"/>
        <rect x="18" y="80" width="130" height="13" fill="#e7c877"/>
        <circle cx="55" cy="108" r="16" fill="#f4d98a" opacity=".65"/>
        <rect x="165" y="40" width="46" height="34" rx="4" fill="#e7cb8c" opacity=".55"/>
        <circle cx="68" cy="176" r="23" fill="#0e0d0a"/><circle cx="68" cy="176" r="9" fill="#3a3226"/>
        <circle cx="268" cy="176" r="23" fill="#0e0d0a"/><circle cx="268" cy="176" r="9" fill="#3a3226"/>
        <text x="245" y="128" font-family="Fraunces, serif" font-weight="800" font-size="22" fill="#f4ecdb">SHADI</text>
      </g>
    </svg>

    <svg class="olive" viewBox="0 0 150 140" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M6 4 Q60 14 96 56" stroke="#6b7a45" stroke-width="3" fill="none"/>
      <path d="M14 12 Q28 3 38 18 Q24 21 14 12Z" fill="#4c5c30"/>
      <path d="M28 26 Q42 16 53 30 Q38 34 28 26Z" fill="#586b34"/>
      <path d="M43 39 Q57 30 68 43 Q54 47 43 39Z" fill="#5c6b3f"/>
      <path d="M58 51 Q71 43 81 55 Q68 59 58 51Z" fill="#6d7e46"/>
      <path d="M71 63 Q83 56 92 67 Q80 71 71 63Z" fill="#788a4e"/>
    </svg>

    <div class="brandblock">
      <img src="logo.jpg" alt="Shadi logo">
    </div>
  </div>

  <div class="divider"></div>

  <div class="info">
    <div class="eyebrow">Scan QR Code</div>
    <div class="sub">For The Menu</div>
    <div class="qrwrap"><div id="qr"></div></div>

    <div class="line"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s7-7.2 7-12a7 7 0 1 0-14 0c0 4.8 7 12 7 12Z"/><circle cx="12" cy="9" r="2.4"/></svg>HARRISBURG&nbsp;&nbsp;|&nbsp;&nbsp;MIDDLETOWN</div>
    <div class="line"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3.1-8.6A2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .3 2 .6 2.9a2 2 0 0 1-.5 2.1L8 10a16 16 0 0 0 6 6l1.3-1.2a2 2 0 0 1 2.1-.5c.9.3 1.9.5 2.9.6a2 2 0 0 1 1.7 2Z"/></svg>717-991-3820</div>

    <div class="rule"></div>
    <div class="social-row">
      <a href="https://instagram.com/shadi" target="_blank" rel="noopener" aria-label="Instagram"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1"/></svg></a>
      <a href="https://facebook.com/shadi" target="_blank" rel="noopener" aria-label="Facebook"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M15 8h2V4h-2a4 4 0 0 0-4 4v2H9v4h2v6h4v-6h2.5L18 10h-3V8.5A.5.5 0 0 1 15.5 8Z"/></svg></a>
      <a href="https://tiktok.com/@shadi" target="_blank" rel="noopener" aria-label="TikTok"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M14 4v10.5a3.5 3.5 0 1 1-3.5-3.5"/><path d="M14 4c.4 2 2 3.5 4 3.8"/></svg></a>
    </div>
    <div class="handle">@SHADI</div>
  </div>
</div>

<script>
  new QRCode(document.getElementById("qr"), {
    text: "https://shadyscoffetruck.github.io/shadi-menu/",
    width: 176,
    height: 176,
    colorDark: "#15140f",
    colorLight: "#ffffff",
    correctLevel: QRCode.CorrectLevel.H
  });
</script>
