<!doctype html>
<title>Shadi Table Card</title>
<style>
  :root{ --page-bg:#efe8d5; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; }
  body{
    background:var(--page-bg);
    font-family:-apple-system, 'Segoe UI', sans-serif;
    display:flex; flex-direction:column; align-items:center; gap:16px;
    padding:26px 14px 40px;
    color:#241f14;
  }
  .toolbar{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; justify-content:center; }
  .toolbar button{
    font-family:inherit; font-size:12.5px; font-weight:700; letter-spacing:.03em;
    padding:9px 16px; border-radius:999px; border:1px solid #15140f;
    background:#15140f; color:#faf6ec; cursor:pointer;
  }
  .toolbar button:hover{ background:#000; }
  .toolbar .hint{ font-size:12px; color:#6b6250; }

  .card-wrap{
    position:relative; width:100%; max-width:1040px;
    box-shadow:0 30px 60px -20px rgba(20,20,15,.35);
    border-radius:26px; overflow:hidden;
  }
  .card-wrap img.card{ width:100%; display:block; }
  .hot{ position:absolute; display:block; }

  @media print{
    body{ background:#fff; padding:0; align-items:flex-start; }
    .toolbar{ display:none; }
    .card-wrap{ box-shadow:none; }
  }
</style>

<div class="toolbar">
  <button onclick="window.print()">Print Table Card</button>
  <span class="hint">Sized as a wide table card &mdash; the QR code scans straight to the live Shadi menu</span>
</div>

<div class="card-wrap">
  <img class="card" src="shadi-table-card.png" alt="Shadi table card with QR code">

  <a class="hot" style="left:72.6%; top:25.2%; width:17.1%; height:30%;" href="https://shadyscoffetruck.github.io/shadifoodtruck/" target="_blank" rel="noopener" aria-label="Open Shadi menu"></a>

  <a class="hot" style="left:68.1%; top:58%; width:28.3%; height:5.8%;" href="https://www.google.com/maps/search/?api=1&query=6535+Grayson+Rd+Harrisburg+PA+17111" target="_blank" rel="noopener" aria-label="Open location in Google Maps"></a>

  <a class="hot" style="left:68.1%; top:64.3%; width:19.3%; height:4.7%;" href="tel:+17179913820" aria-label="Call Shadi"></a>

  <a class="hot" style="left:73.2%; top:75.4%; width:3.6%; height:6.3%;" href="https://instagram.com/shadi" target="_blank" rel="noopener" aria-label="Shadi on Instagram"></a>
  <a class="hot" style="left:80.2%; top:75.4%; width:3.6%; height:6.3%;" href="https://facebook.com/shadi" target="_blank" rel="noopener" aria-label="Shadi on Facebook"></a>
  <a class="hot" style="left:87.1%; top:75.4%; width:3.6%; height:6.3%;" href="https://tiktok.com/@shadi" target="_blank" rel="noopener" aria-label="Shadi on TikTok"></a>
</div>
