<!doctype html>
<title>Shadi Table Card</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,800;9..144,900&family=Work+Sans:wght@400;500;600;700;800&display=swap');

  :root{
    --ink:#0f1f45; --ink-2:#17356b;
    --gold:#c9982e; --gold-soft:#e7cb8c;
    --cream:#faf6ec; --paper:#fffcf6;
    --rust:#b5541f; --olive:#55713f;
    --page-bg:#efe8d5;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; }
  body{
    background:var(--page-bg);
    font-family:'Work Sans', -apple-system, 'Segoe UI', sans-serif;
    display:flex; flex-direction:column; align-items:center; gap:16px;
    padding:26px 14px 40px;
    color:#241f14;
  }
  .toolbar{ display:flex; gap:10px; align-items:center; }
  .toolbar button{
    font-family:inherit; font-size:12.5px; font-weight:700; letter-spacing:.03em;
    padding:9px 16px; border-radius:999px; border:1px solid var(--ink-2);
    background:var(--ink-2); color:var(--cream); cursor:pointer;
  }
  .toolbar button:hover{ background:var(--ink); }
  .toolbar .hint{ font-size:12px; color:#6b6250; }

  .card{
    width:1000px; height:560px;
    background:var(--ink);
    border-radius:26px;
    box-shadow:0 30px 60px -20px rgba(15,31,69,.45);
    display:grid; grid-template-columns:1.35fr 1fr;
    overflow:hidden;
    position:relative;
  }

  /* -------- Left: scene -------- */
  .scene{
    position:relative;
    background:linear-gradient(180deg, #1c2f5c 0%, #12234c 55%, #0b1938 100%);
    overflow:hidden;
  }
  .scene .glow{
    position:absolute; left:50%; top:8%; width:520px; height:520px; transform:translateX(-50%);
    background:radial-gradient(circle, rgba(201,152,46,.32), transparent 60%);
  }
  .scene svg.illus{ position:absolute; inset:0; display:block; }
  .scene .brandblock{
    position:absolute; left:50%; top:34px; transform:translateX(-50%); text-align:center;
  }
  .scene .brandblock svg{ width:140px; height:auto; display:block; margin:0 auto; filter:drop-shadow(0 6px 14px rgba(0,0,0,.35)); }
  .scene .brandblock p{
    margin:2px 0 0; font-family:'Fraunces',serif; font-style:italic; font-size:13px; color:var(--gold-soft);
  }

  /* -------- Right: info -------- */
  .info{
    background:linear-gradient(175deg, var(--ink-2), var(--ink));
    color:var(--cream);
    padding:40px 38px 30px;
    display:flex; flex-direction:column; align-items:center; text-align:center;
  }
  .info .eyebrow{ font-size:19px; font-weight:800; letter-spacing:.05em; color:var(--paper); }
  .info .sub{ font-size:11.5px; font-weight:700; letter-spacing:.22em; text-transform:uppercase; color:var(--gold-soft); margin-top:4px; }
  .qrwrap{
    background:#fff; border-radius:16px; padding:14px; margin:20px 0 18px;
    box-shadow:0 12px 24px -10px rgba(0,0,0,.4);
  }
  #qr{ width:176px; height:176px; }
  #qr img{ display:block; width:176px !important; height:176px !important; }

  .info .line{ display:flex; align-items:center; gap:8px; font-size:13.5px; font-weight:600; margin:5px 0; }
  .info .line svg{ width:14px; height:14px; color:var(--gold); flex:none; }
  .rule{ width:70%; height:1px; background:rgba(233,205,147,.25); margin:16px 0 14px; }
  .social-row{ display:flex; gap:10px; }
  .social-row a{
    width:32px; height:32px; border-radius:50%;
    background:rgba(233,205,147,.12); border:1px solid rgba(233,205,147,.35);
    display:flex; align-items:center; justify-content:center; color:var(--gold-soft); text-decoration:none;
  }
  .social-row svg{ width:14px; height:14px; }
  .handle{ margin-top:10px; font-weight:800; letter-spacing:.05em; font-size:13px; color:var(--gold-soft); }

  @media print{
    body{ background:#fff; padding:0; align-items:flex-start; }
    .toolbar{ display:none; }
    .card{ box-shadow:none; margin:0; }
  }
</style>

<div class="toolbar">
  <button onclick="window.print()">Print Table Card</button>
  <span class="hint">Sized for a 4×2.24&Prime; table card &mdash; scan links straight to the live Shadi menu</span>
</div>

              <rect x="125" y="34" width="13" height="18"/><rect x="143" y="24" width="16" height="28"/>

              <rect x="206" y="30" width="13" height="22"/><rect x="224" y="14" width="15" height="38"/>

            <circle cx="107" cy="14" r="9" fill="#c9982e" opacity=".9"/>

      <p>Fresh Mediterranean Flavors</p>
    </div>
  </div>

  <div class="info">
    <div class="eyebrow">Scan QR Code</div>
    <div class="sub">For The Menu</div>
    <div class="qrwrap"><div id="qr"></div></div>

</div>

<script>
  new QRCode(document.getElementById("qr"), {
    text: "https://shadyscoffetruck.github.io/shadi-menu/",
    width: 176,
    height: 176,
    colorDark: "#0f1f45",
    colorLight: "#ffffff",
    correctLevel: QRCode.CorrectLevel.H
  });
</script>
